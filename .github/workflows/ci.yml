name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.lock
          pip install --no-deps -e .

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Type check (mypy)
        run: mypy app

      - name: Test (pytest, replay mode)
        env:
          NANSEN_MODE: replay
        run: pytest

  ui-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ui.lock
          pip install --no-deps -e .
          playwright install --with-deps chromium

      - name: UI tests (screenshots, axe-core, keyboard nav)
        env:
          NANSEN_MODE: replay
        run: pytest tests/ui

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: tests/ui/screenshots/
          retention-days: 14

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t lp-radar:ci .

  stack-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose file and Caddyfile
        run: |
          printf 'NANSEN_API_KEY=x\n' > .env
          docker compose -f docker-compose.yml -f deploy/docker-compose.ci.yml config -q
          docker run --rm -e SITE_ADDRESS=:80 -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            --entrypoint sh caddy:2 -c 'mkdir -p /run/caddy && : > /run/caddy/auth.caddy && caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile'
          rm .env

      - name: Smoke test (stack, login, fails closed, worker restart)
        run: bash deploy/smoke.sh
