<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="htmx-config" content='{"allowEval": false, "includeIndicatorStyles": false}'>
  <title>{% block title %}LP Radar{% endblock %}</title>
  <link rel="preload" href="/static/fonts/ibm-plex-sans-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/static/fonts/ibm-plex-sans-600.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="stylesheet" href="/static/css/type.css">
  <link rel="stylesheet" href="/static/css/layout.css">
  <link rel="stylesheet" href="/static/css/components.css">
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js" defer></script>
  <script src="/static/js/address-chip.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="wrap header-row">
      <a class="brand" href="/">LP Radar</a>
      <nav aria-label="Main">
        <a href="/" {% if active == "tokens" %}aria-current="page"{% endif %}>Tokens</a>
        <a href="/status" {% if active == "status" %}aria-current="page"{% endif %}>Status</a>
      </nav>
    </div>
  </header>
  <main class="wrap">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <div class="wrap">Research tool, not financial advice. Powered by
      <a href="https://nansen.ai/" rel="noopener noreferrer">Nansen API</a>.</div>
  </footer>
</body>
</html>
